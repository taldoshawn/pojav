name: Android APK
run-name: Pojav Rust APK · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      all_abis:
        description: Build ARM64, ARMv7, x86 and x86_64
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON((github.event_name == 'push' || inputs.all_abis) && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reserve build space on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup
          if (( $(awk '/MemTotal/ {print $2}' /proc/meminfo) < 12000000 )); then
            sudo fallocate -l 8G /mnt/pojav-build.swap
            sudo chmod 600 /mnt/pojav-build.swap
            sudo mkswap /mnt/pojav-build.swap
            sudo swapon /mnt/pojav-build.swap
          fi
          df -h .
          free -h
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'
      - name: Install Android and Rust toolchains
        env:
          ABI: ${{ matrix.abi }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: pojav-android-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            pojav-android-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Test protocol and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
          cargo test -p horizon-protocol --lib --test legacy18 --locked
          cargo test -p horizon-world legacy_network_states --lib --locked
          cargo build -p horizon-protocol --example legacy_server_probe --locked
          python3 tools/legacy_test_server.py --probe "$CARGO_TARGET_DIR/debug/examples/legacy_server_probe"
          python3 tools/test_android_updater.py
          rustc --edition=2024 --test crates/horizon-client/src/android/local_profiles.rs -o /tmp/pojav-local-profile-tests
          /tmp/pojav-local-profile-tests
          rustc --edition=2024 --test crates/horizon-client/src/android/fps_hud.rs -o /tmp/pojav-fps-hud-tests
          /tmp/pojav-fps-hud-tests
      - name: Prepare verified private engine inputs
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME_25_X64"
      - name: Verify touch controls on the host
        if: matrix.abi == 'arm64-v8a'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev
          CARGO_PROFILE_TEST_DEBUG=0 cargo test -p horizon-client-render --lib touch::custom::tests --locked
      - name: Restore this fork's signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          present = [bool(os.environ.get(k)) for k in ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS')]
          if not any(present):
              print('No repository signing key: build uses an ephemeral development certificate.')
              raise SystemExit(0)
          if not all(present):
              raise SystemExit('Repository Android signing secrets are incomplete')
          path = Path('.local/android/ci.keystore').resolve()
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          values = {'HORIZON_ANDROID_KEYSTORE': str(path),
                    'HORIZON_ANDROID_KEYSTORE_PASSWORD': os.environ['KEYSTORE_PASSWORD'],
                    'HORIZON_ANDROID_KEY_PASSWORD': os.environ['KEYSTORE_PASSWORD'],
                    'HORIZON_ANDROID_KEY_ALIAS': os.environ['KEY_ALIAS']}
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Build and audit the optimized APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --app-id dev.taldoshawn.pojav --sdk "$ANDROID_HOME" \
            --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect APK and checksums
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist'); out.mkdir(exist_ok=True)
          abi, commit = os.environ['ABI'], os.environ['GITHUB_SHA']
          name = f'Pojav-Rust-{os.environ["GITHUB_RUN_NUMBER"]}-{commit[:12]}-{abi}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {name}\n')
          for source in ('LICENSE', 'THIRD_PARTY_NOTICES.md'):
              shutil.copyfile(source, out / source)
          metadata = {'commit': commit, 'abi': abi, 'package': 'dev.taldoshawn.pojav',
                      'signing': 'repository-key' if os.environ.get('HORIZON_ANDROID_KEYSTORE') else 'ephemeral-development',
                      'game_target': '26.3', 'legacy_1_8_gameplay': False,
                      'device_tested': False, 'sha256': digest,
                      'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          (out / 'BUILD.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## APK {abi}\n\nDownload the artifact and extract `{name}`.\n\n'
                            f'Source: `{commit}`. Game target: 26.3. Protocol 47 is integrated but experimental; check the separate Android gameplay test.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pojav-rust-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain completed compiler work even if a later build step failed
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Remove signing files
        if: always()
        run: rm -f .local/android/ci.keystore .local/android/debug.keystore
