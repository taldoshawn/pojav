name: Publish verified owner-signed APKs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download the exact original build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43251468836 --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Restore and verify offline signatures
        run: |
          sdkmanager --install 'build-tools;35.0.0' >/dev/null
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="dist/Pojav-Rust-0.1.0-$abi.apk"
            python3 tools/apk_signature_patch.py apply \
              "artifacts/pojav-rust-2-$abi/Pojav-Rust-2-167ff1a1375b-$abi.apk" \
              "packaging/releases/0.1.0-alpha.1/$abi.json" "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "dist/$abi-signature.txt"
            python3 tools/check_android_release.py "$apk" --public --app-id dev.taldoshawn.pojav \
              --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --report "dist/$abi-audit.json"
          done
          cp packaging/releases/0.1.0-alpha.1/BUILD.json packaging/releases/0.1.0-alpha.1/SHA256SUMS.txt LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Upload only verified public files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" dist/*
