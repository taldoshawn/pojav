name: Android installation smoke test
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK run ID
        required: true
        type: string
      probe_profiles:
        description: Create and switch two local profiles through the UI
        type: boolean
        default: false
      server:
        description: Optional public server connection probe (no registration or chat)
        type: choice
        options: [none, mush, legacy18]
        default: none
      probe_world:
        description: Also explore creating a flat world (requires probe_game)
        type: boolean
        default: false
      probe_game:
        description: Explore resource download and launch, retaining screenshots
        type: boolean
        default: false
      run_number:
        description: Android APK run number
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download this repository's x86_64 APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || inputs.run_number }}
        run: |
          mkdir -p apk evidence
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "pojav-rust-$RUN_NUMBER-x86_64" --dir apk
          (cd apk && sha256sum --check SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start the actual APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          PROBE_GAME: ${{ inputs.probe_game || 'false' }}
          PROBE_WORLD: ${{ inputs.probe_world || 'false' }}
          TEST_SERVER: ${{ inputs.server || 'none' }}
          PROBE_PROFILES: ${{ inputs.probe_profiles || 'false' }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: python3 tools/android_smoke.py
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-startup-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
